<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#f4f5f4" />
    <title>页脉认知循环交互原型</title>
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/prototype.css" />
  </head>
  <body>
    <!-- Three cognition-loop variants, switchable via ?variant=, hosted as an isolated Side Panel prototype. -->
    <main id="prototype-root"></main>
    <div class="prototype-switcher" aria-label="原型方案切换器">
      <button type="button" data-switch-variant="previous" aria-label="上一个方案">←</button>
      <button class="prototype-switcher__label" type="button" data-reset-prototype aria-label="重新开始当前方案">
        <strong id="variant-label">A</strong>
        <span id="phase-label">对话</span>
      </button>
      <button type="button" data-switch-variant="next" aria-label="下一个方案">→</button>
    </div>
    <div id="prototype-announcer" class="visually-hidden" aria-live="polite"></div>
    <script type="module" src="/prototype.js"></script>
  </body>
</html>
